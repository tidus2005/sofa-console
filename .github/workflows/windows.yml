name: Windows build and mouse tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Mouse regression tests (no desktop input)
        shell: pwsh
        run: ./RunMouseTests.ps1
      - name: Build Windows application
        shell: pwsh
        run: ./Build.ps1
